XBotInterface:
    urdf: xacro $(ros2 pkg prefix --share kyon_urdf)/urdf/kyon.urdf.xacro upper_body:=true legs:=true varta:=true dagana:=false wheels:=false
    srdf: xacro $(ros2 pkg prefix --share kyon_srdf)/srdf/kyon.srdf.xacro upper_body:=true legs:=true varta:=true dagana:=false wheels:=false

ModelInterface:
  model_type: pin

# hal
xbotcore_device_configs:
    sim: $(rospack find kyon_config)/hal/kyon_gz.yaml
    dummy: $(ros2 pkg prefix --share kyon_config)/hal/kyon_dummy.yaml
    ec_idle: $PWD/hal/ec_all_ros2.yaml
    ec_pos: $PWD/hal/ec_all_ros2.yaml


# threads
xbotcore_threads:
    rt_main:  {sched: fifo , prio: 60, period: 0.001, core_id: 3}
    nrt_main: {sched: other, prio: 0 , period: 0.001}
    main: {sched: other, prio: 0 , period: 0.001, main: true}


# plugins
xbotcore_plugins:

    # homing:
    #     thread: rt_main
    #     type: homing

    stress_removal:
      thread: nrt_main
      type: internal_stress_removal_plugin
      params:
        contact_links: [contact_1, contact_2, contact_3, contact_4]

    homing_isaac:
      thread: rt_main
      type: homing
      params: 
          home: home_isaac 
          
    homing_lb:
      thread: rt_main
      type: homing
      params:
        ctrl_override:  # homing does not affect grippers and upper body
          dagana_1_clamp_joint: 0
          dagana_2_clamp_joint: 0
          shoulder_yaw_1: 0
          shoulder_pitch_1: 0
          elbow_pitch_1: 0
          wrist_pitch_1: 0
          wrist_yaw_1: 0
          shoulder_yaw_2: 0
          shoulder_pitch_2: 0
          elbow_pitch_2: 0
          wrist_pitch_2: 0
          wrist_yaw_2: 0

    homing_ub:
      thread: rt_main
      type: homing
      params:
        ctrl_override:  # homing does not affect lower body
          hip_roll_1: 0
          hip_pitch_1: 0
          knee_pitch_1: 0
          hip_roll_2: 0
          hip_pitch_2: 0
          knee_pitch_2: 0
          hip_roll_3: 0
          hip_pitch_3: 0
          knee_pitch_3: 0
          hip_roll_4: 0
          hip_pitch_4: 0    
          knee_pitch_4: 0

