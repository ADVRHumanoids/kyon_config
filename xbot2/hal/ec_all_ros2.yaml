xbotcore_devices:

  imu_ros2_device:
    thread: main
    names: [imu_link]
  
  joint_ec_synapticon:
    names: []
    thread: rt_main
    params:
      ignore_id: [99]
      robot_name: &rn { value: NoNe, type: string }
      config_ec_pos:
        value: $PWD/../joint_config/position.yaml
        type: yamlfile
      config_ec_effort:
        value: $PWD/../joint_config/effort.yaml
        type: yamlfile
      config_ec_idle:
        value: $PWD/../joint_config/idle.yaml
        type: yamlfile
      joint_id_map: &jim
        value: $PWD/../joint_map/joint_map.yaml
        type: yamlfile

  pow_ec_advrf:
    names: []
    thread: rt_main
    params:
      robot_name: &rn { value: NoNe, type: string }
      joint_id_map: &jim
        value: $PWD/../joint_map/joint_map.yaml
        type: yamlfile

