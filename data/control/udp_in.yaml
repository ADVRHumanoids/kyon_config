# UDP bridge, end 2. See doc/parameters.md for what each parameter does.
/**/*:
  ros__parameters:
    networkInterface: "network_bridge::UdpInterface"

    UdpInterface:
      port: 5001                        # binds here, and answers wherever the peer called from
      # This end only republishes what it receives, so it never sends first and needs no
      # remoteAddress: it takes the peer, port included, from the first datagram that arrives.
      # remoteAddress: 10.24.15.135     #e.g. 10.8.0.1, only on the end that sends first
      # localAddress: 10.24.15.102      #e.g. 10.8.0.2, only to pin one interface

    defaultRate: 100.0

    defaultZstdLevel: 3

    useCloudini: true
    cloudiniResolution: 0.001

    useGstreamer: true
    gstreamerBitrateKbps: 4000
    gstreamerGopSize: 30
    decoderPipelineFile: "config/topic_bridge/decoders/h264_cpu.yaml"

    publishStaleData: False


    publishNamespace: "/udp2"
