# UDP bridge, end 1. See doc/parameters.md for what each parameter does.
/**/*:
  ros__parameters:
    networkInterface: "network_bridge::UdpInterface"

    UdpInterface:
      port: 5000                      # the port this end binds, and answers on
      remoteAddress: 10.24.15.102     # the peer, e.g. 10.8.0.2; this end sends first
      remotePort: 5001                # the peer's port
      # localAddress: 10.24.15.135    # only to pin one interface on a multi-homed host
      fec: true
      fecLossTolerance: 0.10          # fraction of a message's blocks that may be lost
      fecRepair: true
      pathMtuDiscovery: true
      linkRateBytesPerSec: 0
      sendQueueMaxSeconds: 2.0        # how far behind the link the queue may fall

    defaultRate: 100.0
    defaultZstdLevel: 3
    publishStaleData: False
    topicIdAnnouncePeriodS: 2.0
    batchWindowMs: 0
    batchMaxMessageSize: 256
    batchMaxBytes: 1200
    useCloudini: true
    cloudiniResolution: 0.001        # metres; 0.001 indoors, 0.01 outdoors
    useGstreamer: true
    gstreamerBitrateKbps: 4000
    gstreamerGopSize: 30            # a loss corrupts the picture for gop_size / rate seconds
    maxGstreamerDecoders: 8
    encoderPipelineFile: "config/topic_bridge/encoders/h264_cpu.yaml"

    allTopics: false
    topics:
      - /policy_deploy_node/commands/base_velocity
      - /omnisteering/cmd_vel

    /policy_deploy_node/commands/base_velocity:
      priority: 0

    /omnisteering/cmd_vel:
      priority: 10

    subscribeNamespace: ""

    ###
    ## network -> ROS2
    ###

    publishNamespace: "/udp1"
