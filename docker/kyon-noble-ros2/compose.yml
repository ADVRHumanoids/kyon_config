services:
  base:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_IP: ${ROS_IP}
    stdin_open: true
    tty: true 
    privileged: true
    entrypoint: /bin/bash
    network_mode: host
    cap_add:
      - ALL
    restart: no
    ulimits: 
      core: -1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # x11
      - ~/.ssh:/home/user/.ssh  # ssh
        # Mount the kyon_config repository root into the container
      - ../../:/home/user/xbot2_ws/src/kyon_config:ro
      - /dev:/dev
    environment:
      - TERM=xterm-256color
      - DISPLAY
      - HHCM_FOREST_CLONE_DEFAULT_PROTO=https
      - ZENOH_CONFIG_OVERRIDE
      - CONFIG_PATH_DOCKER

  dev:
    extends: base 
    restart: always
    volumes:
      - ~/.cache/kyon-noble-ros2-dev:/home/user/data
    environment:
      - CUSTOM_PS=(dev)


  dev-nvidia:
    extends: dev
    restart: always
    volumes:
      - ~:/home/user/host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1


  xbot2_gui_server:
    extends: base
    entrypoint: bash -ic "cd ~/xbot2_ws/src/kyon_config; xbot2_gui_server gui/gui_server_config.yaml; bash"
    restart: always
    environment:
      - CUSTOM_PS=(xbot2_gui_server)

  zenoh_bridge_client:
    image: eclipse/zenoh-bridge-ros2dds:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../:/etc/kyon_config:ro
    environment:
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
    command: "-e tcp/10.24.15.102:7447"
    
  zenoh_bridge_server:
    extends: zenoh_bridge_client
    environment:
      - CYCLONEDDS_URI=file:///etc/kyon_config/network/cyclone/cyclonedds-control.xml
    command: ""

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-xbot2-diagnostics-dev-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-xbot2}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-diagnostics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-xbot2-diagnostics-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  diagnostics_aggregator:
    extends: base
    restart: always
    entrypoint: bash -ic 'python3 -m pyxbot2_diagnostics.aggregator.aggregator_node --config /etc/kyon_config/diagnostics/aggregator.yaml'
    volumes:
      - ../..:/etc/kyon_config:ro


volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
