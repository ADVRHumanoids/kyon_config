services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_IP: ${ROS_IP}
        USER_ID: ${UID:-1000}
      secrets:
        - deploy_key
    container_name: kyon-noble-ros2-jetpack-dev-1
    stdin_open: true
    tty: true
    privileged: true
    restart: always
    network_mode: host
    runtime: nvidia
    ipc: host
    group_add:
      - "44"     # video
      - "104"    # render
    ulimits:
      core: -1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # x11
      - ~/.ssh:/home/user/.ssh  # ssh
      - /dev:/dev
      - /var/nvidia/nvcam/settings:/var/nvidia/nvcam/settings
      - /tmp:/tmp
      - ../../:/home/user/xbot2_ws/src/kyon_config:ro
      - ../../data/perception/mediamtx.yml:/home/user/ros2_ws/src/network_bridge/mediamtx/mediamtx.yml
      - ../../data/perception/rtsp.yaml:/home/user/ros2_ws/src/network_bridge/config/rtsp_bridge/kyon.yaml
      - ../../data/perception/h265_jetson_sink.yaml:/home/user/ros2_ws/src/network_bridge/config/rtsp_bridge/h265_kyon_sink.yaml
    environment:
      - DISPLAY
      - TERM=xterm-256color
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HHCM_FOREST_CLONE_DEFAULT_PROTO=https
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - CONFIG_PATH_DOCKER

secrets:
  # Read-only github deploy key for advrhumanoids/network_bridge, used at build
  # time to clone it. The file must exist and hold the key -- compose fails
  # before the build otherwise.
  deploy_key:
    file: ${NETWORK_BRIDGE_DEPLOY_KEY:-${HOME}/.ssh/network_bridge_deploy_key}
