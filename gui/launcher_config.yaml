#   docker: *docker-dev
#   show_ui: false

loco_isaac:
  cmd: ros2 launch policy_deploy_toolkit run_example.launch.xml example:=kyon_locomotion_flat use_sim_time:=false
  machine: *control
  docker: *docker-base
  show_ui: true

