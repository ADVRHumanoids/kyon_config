context:
  session: kyon
  params:
    hw_type: ec_pos
    knee_mode_flag: ''
  .defines:
    - &embedded embedded@10.24.15.100
    - &control kyon@10.24.15.102
    - &vision kyon@10.24.15.101

    - &docker-xeno  kyon-noble-ros2-xeno-exp-1
    - &docker-base  kyon-noble-ros2-dev-1
    - &docker-isaac  kyon-isaac-base
    - &docker-jetpack kyon-noble-ros2-jetpack-dev-1
    
    - &camera-up-serialno 52061328
    - &camera-down-serialno 56033502


imu:
  cmd: ros2 launch vectornav vectornav.launch.py
  machine: *control
  ready_check: timeout 5 ros2 topic echo /xbotcore/imu/imu_link --once
  docker: *docker-base

ecat:
  cmd: ecat_master
  machine: *embedded
  docker: *docker-xeno

xbot2:
  cmd: xbot2-core --hw {hw_type} --config /home/user/xbot2_ws/src/kyon_config/xbot2/kyon_basic_ros2.yaml
  machine: *embedded
  ready_check: timeout 5 ros2 topic echo /xbotcore/joint_states --once
  docker: *docker-xeno
  depends: [imu]
  variants:
    verbose:
      cmd: "{cmd} -V"
    ctrl:
      - ec_idle:
          params:
            hw_type: ec_idle
      - ec_pos:
          params:
            hw_type: ec_pos
      - dummy:
          params:
            hw_type: dummy

park:
  cmd: ros2 run kyon_cartesio parking.py -a park
  machine: *control
  docker: *docker-base

unpark:
  cmd: ros2 run kyon_cartesio parking.py -a unpark {knee_mode_flag}
  machine: *control
  docker: *docker-base
  variants:
    fast:
      cmd: "{cmd} -t 1.0"
    knee_mode:
      - auto:
          params:
            knee_mode_flag: ""
      - ferk:
          params: 
            knee_mode_flag: "--force-ferk"
      - alle:
          params:
            knee_mode_flag: "--force-alle"


zed_up:
  cmd: ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zedxm serial_number:=52061328 camera_name:=zed_up publish_tf:=false camera_tf_parent_frame:=zed_front_up_mount_link
  machine: *vision
  docker: zed_ros2_jazzy_container
  ready_check: timeout 5 ros2 topic echo /zed_up/zed_node/rgb/color/rect/image/compressed --once
  show_ui: false

zed_down:
  cmd: ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zedxm serial_number:=56033502 camera_name:=zed_down publish_tf:=false camera_tf_parent_frame:=zed_front_down_mount_link
  machine: *vision
  docker: zed_ros2_jazzy_container
  ready_check: timeout 5 ros2 topic echo /zed_down/zed_node/rgb/color/rect/image/compressed --once
  show_ui: false  


rtsp_bridge:
  cmd: ros2 launch network_bridge rtsp_bridge_rtsp_bridge.launch.py config:=/home/user/ros2_ws/src/kyon_config/data/perception/rtsp.yaml
  machine: *vision
  docker: *docker-jetpack
  show_ui: false

cam_record:
  cmd: python /home/user/ros2_ws/src/kyon_config/data/perception/record_cameras.py
  machine: *vision
  docker: *docker-jetpack
  show_ui: false
  depends: [rtsp_bridge]

