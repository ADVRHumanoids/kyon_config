context:
  session: kyon
  params:
    hw_type: ec_pos
  .defines:
    - &embedded embedded@10.24.15.100
    - &control kyon@10.24.15.102
    - &vision kyon@10.24.15.101

    - &docker-xeno  kyon-noble-ros2-xeno-exp-1
    - &docker-base  kyon-noble-ros2-dev-1
    - &docker-isaac  kyon-isaac-base


imu: 
  cmd: ros2 launch vectornav vectornav.launch.py
  machine: *control
  ready_check: timeout 5 ros2 topic echo /xbotcore/imu/imu_link --once
  docker: *docker-base

ecat:
  cmd: ecat_master
  machine: *embedded
  docker: *docker-xeno

xbot2:
  cmd: xbot2-core --hw {hw_type} --config /home/user/xbot2_ws/src/kyon_config/xbot2/kyon_basic_ros2.yaml
  machine: *embedded
  ready_check: timeout 5 ros2 topic echo /xbotcore/joint_states --once
  docker: *docker-xeno
  variants:
    verbose:
      cmd: "{cmd} -V"
    ctrl:
      - ec_idle:
          params:
            hw_type: ec_idle
      - ec_pos:
          params:
            hw_type: ec_pos
      - dummy:
          params:
            hw_type: dummy

park:
  cmd: ros2 run kyon_cartesio parking.py -a park
  machine: *embedded
  docker: *docker-xeno

unpark:
  cmd: ros2 run kyon_cartesio parking.py -a unpark
  machine: *embedded
  docker: *docker-xeno

# record_bag:
