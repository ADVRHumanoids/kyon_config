lidar:
  cmd: ros2 run hesai_ros_driver hesai_ros_driver_node --ros-args -p config_path:=/home/user/xbot2_ws/src/kyon_config/hesai/top_qt128_config.yaml
  machine: *control
  docker: *docker-base
  ready_check: timeout 5 ros2 topic echo /lidar_points --once
  show_ui: false

record_bag:
  cmd: ~/record_bag.bash
  machine: *control
  docker: *docker-base
  show_ui: false

loco_isaac:
  cmd: ros2 launch kyon_locomotion autorun_policy.launch.xml use_sim_time:=false
  machine: *control
  docker: *docker-base
  show_ui: true
  variants:
    distilled:
      cmd: "{cmd} distilled:=true"
    heightscan:
      cmd: "{cmd} heightscan:=true"

loco_fasce:
  cmd: /home/user/al-experimental-policies/run_policy.bash
  machine: *control
  docker: *docker-base
  show_ui: true

lio:
  cmd: ros2 launch lio_mapping bag.launch.py use_sim_time:=false tmux:=false launch_rviz:=false
  machine: *vision
  docker: *docker-jetpack
  show_ui: false
  depends: [imu, lidar]
  variants: 
    loc_fasce:
      cmd: "{cmd} mode:=localization map_dir:=maps/fasce/"
    loc_iit:
      cmd: "{cmd} mode:=localization map_dir:=maps/iit_floor/"
    odom:
      cmd: "{cmd} mode:=odometry"


nav:
  cmd: ros2 launch kyon_navigation nav.launch.py tmux:=false use_sim_time:=false launch_rviz:=false
  machine: *vision
  docker: *docker-jetpack
  show_ui: false
  variants:
      fasce: 
        cmd: "{cmd} map_dir:=/home/user/ros2_ws/maps/fasce/"
      iit:
        cmd: "{cmd} map_dir:=/home/user/ros2_ws/maps/iit_floor/"
      exploration_odometry:
        cmd: "{cmd} explore:=true localization:=odometry"
      exploration_iit:
        cmd: "{cmd} localization:=global map_dir:=/home/user/ros2_ws/maps/iit_floor/ explore:=true"
      exploration_fasce:
        cmd: "{cmd} localization:=global map_dir:=/home/user/ros2_ws/maps/iit_fasce/ explore:=true"
      omnisteering:
        cmd: "{cmd} cmd_vel_topic:=/omnisteering/cmd_vel"

